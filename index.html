<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b100f" />
    <meta name="description" content="Morrow is a private, local-first activity, sleep, and recovery journal." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Morrow — daily readiness, made clear</title>
  </head>
  <body>
    <div class="app-frame">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#today" data-page="today" aria-label="Morrow home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-word">morrow<span class="brand-period">.</span></span>
        </a>
        <div class="sidebar-caption">YOUR RHYTHM</div>
        <nav class="nav-list" id="desktop-nav"></nav>
        <div class="sidebar-bottom">
          <div class="privacy-mini"><span class="privacy-dot"></span><span>Private by default</span></div>
          <div class="sidebar-foot">A clearer read on your day.</div>
        </div>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <div class="mobile-brand">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
            <span class="brand-word">morrow<span class="brand-period">.</span></span>
          </div>
          <div class="topbar-context" id="topbar-context"></div>
          <div class="topbar-actions">
            <span id="sample-pill" class="sample-pill"><span class="sample-dot"></span> SAMPLE DATA</span>
            <button class="icon-button settings-shortcut" data-page="settings" aria-label="Open settings" title="Settings">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2Z"/><path d="m19.4 13.5 1.1.8-1.1 1.9-1.3-.5a7.7 7.7 0 0 1-1.4.8l-.2 1.4h-2.2l-.3-1.4a7.5 7.5 0 0 1-1.6 0l-.3 1.4H10l-.2-1.4a7.7 7.7 0 0 1-1.4-.8l-1.3.5L6 14.3l1.1-.8a6.6 6.6 0 0 1 0-1.6L6 11.1l1.1-1.9 1.3.5a7.7 7.7 0 0 1 1.4-.8L10 7.5h2.2l.3 1.4a7.5 7.5 0 0 1 1.6 0l.3-1.4h2.2l.2 1.4a7.7 7.7 0 0 1 1.4.8l1.3-.5 1.1 1.9-1.1.8a6.6 6.6 0 0 1 0 1.6Z"/></svg>
            </button>
          </div>
        </header>
        <main id="view" class="view" tabindex="-1"></main>
      </div>
      <nav class="mobile-nav" id="mobile-nav" aria-label="Main navigation"></nav>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
